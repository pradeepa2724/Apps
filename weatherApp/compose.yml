services:

  postgres:
    image: postgres:18
    container_name: postgresql-db-compose
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: weatherdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

  app:
    build: .
    image: weather-app
    container_name: elastic-swanson-compose

    ports:
      - "8080:8080"

    depends_on:
    - postgres
volumes:
  postgres-data:
